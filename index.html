<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="settings-page">
    <section class="settings-card" aria-labelledby="settings-heading">
      <header class="settings-header">
        <h1 id="settings-heading">User Settings</h1>
        <p class="settings-subtitle">Update your profile and preferences.</p>
      </header>
      <form id="settings-form" novalidate>
        <fieldset class="form-section">
          <legend>Profile</legend>
          <div class="form-group">
            <label for="display-name">Display Name <span class="required">*</span></label>
            <input
              type="text"
              id="display-name"
              name="displayName"
              autocomplete="name"
              placeholder="Jane Doe"
              minlength="2"
              maxlength="50"
              required
            >
            <p class="error-message" id="display-name-error" role="alert"></p>
          </div>
          <div class="form-group">
            <label for="email">Email <span class="required">*</span></label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="jane@example.com"
              required
            >
            <p class="error-message" id="email-error" role="alert"></p>
          </div>
          <div class="form-group">
            <label for="phone">Phone</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              autocomplete="tel"
              placeholder="+1 (555) 123-4567"
            >
            <p class="hint">Optional. Use digits, spaces, dashes, or parentheses.</p>
            <p class="error-message" id="phone-error" role="alert"></p>
          </div>
          <div class="form-group">
            <label for="bio">Bio</label>
            <textarea
              id="bio"
              name="bio"
              rows="4"
              maxlength="200"
              placeholder="Tell us a little about yourself..."
            ></textarea>
            <p class="hint"><span id="bio-count">0</span> / 200 characters</p>
            <p class="error-message" id="bio-error" role="alert"></p>
          </div>
        </fieldset>
        <fieldset class="form-section">
          <legend>Security</legend>
          <div class="form-group">
            <label for="password">New Password</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="new-password"
              placeholder="Leave blank to keep current password"
              minlength="8"
            >
            <p class="hint">At least 8 characters with a letter and a number.</p>
            <p class="error-message" id="password-error" role="alert"></p>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirmPassword"
              autocomplete="new-password"
              placeholder="Re-enter new password"
            >
            <p class="error-message" id="confirm-password-error" role="alert"></p>
          </div>
        </fieldset>
        <fieldset class="form-section">
          <legend>Preferences</legend>
          <div class="form-group">
            <label for="language">Language</label>
            <select id="language" name="language">
              <option value="en">English</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
            </select>
            <p class="error-message" id="language-error" role="alert"></p>
          </div>
          <div class="form-group checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="email-notifications" name="emailNotifications" checked>
              Email notifications
            </label>
          </div>
          <div class="form-group checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="marketing-emails" name="marketingEmails">
              Marketing emails
            </label>
          </div>
        </fieldset>
        <div class="form-actions">
          <button type="reset" class="btn btn-secondary">Reset</button>
          <button type="submit" class="btn btn-primary">Save Settings</button>
        </div>
        <p class="success-message" id="form-success" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
