<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="form-title">
      <header class="card-header">
        <h1 id="form-title">User Settings</h1>
        <p class="card-subtitle">Update your account information below.</p>
      </header>

      <form id="settings-form" novalidate>
        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" placeholder="Enter your full name">
          <span class="error-message" id="full-name-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com">
          <span class="error-message" id="email-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••">
          <span class="error-message" id="password-error" aria-live="polite"></span>
        </div>

        <div id="form-success" class="success-message" aria-live="polite"></div>
        
        <button type="submit" class="btn-submit">Save Settings</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
